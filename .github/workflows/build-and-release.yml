name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Auto bump version
        run: |
          chmod +x scripts/bump-version.sh
          bash scripts/bump-version.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/app.config.ts package.json server/src/routes/versions.ts
          git commit -m "chore: 自动更新版本号到 $(node -p "require('./package.json').version")" || echo "No version bump needed"
          git pull --rebase origin main
          git push origin main

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build Android APK
        env:
          EXPO_PUBLIC_BACKEND_BASE_URL: https://6458c7a8-0b18-46c1-a294-8cd82523b342.dev.coze.site
        run: |
          # 写入 .env 文件确保 Expo 构建时能正确读取后端地址
          echo "EXPO_PUBLIC_BACKEND_BASE_URL=https://6458c7a8-0b18-46c1-a294-8cd82523b342.dev.coze.site" > client/.env
          cat client/.env
          cd client
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body: |
            ## 更新内容
            
            自动构建版本 ${{ steps.get_version.outputs.version }}
            
            ### 构建信息
            - 构建时间：${{ github.event.head_commit.timestamp }}
            - 提交信息：${{ github.event.head_commit.message }}
          files: client/android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag：${{ steps.get_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- APK 已上传到 GitHub Release" >> $GITHUB_STEP_SUMMARY
