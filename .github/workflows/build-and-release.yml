name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and add to PATH
        run: |
          npm install -g pnpm@9.0.0
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Verify pnpm
        run: pnpm --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Bump version
        id: bump_version
        run: |
          bash scripts/bump-version.sh
          # 获取新版本号
          NEW_VERSION=$(grep -oP '"version":\s*"\K[^"]+' client/app.config.ts)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/app.config.ts package.json server/src/routes/versions.ts
          git commit -m "chore: 自动更新版本号到 ${{ steps.bump_version.outputs.version }}" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd client
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.tag }}
          name: Release ${{ steps.bump_version.outputs.tag }}
          body: |
            ## 更新内容
            
            自动构建版本 ${{ steps.bump_version.outputs.version }}
            
            ### 构建信息
            - 构建时间：${{ github.event.head_commit.timestamp }}
            - 提交信息：${{ github.event.head_commit.message }}
          files: client/android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：${{ steps.bump_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag：${{ steps.bump_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- APK 已上传到 GitHub Release" >> $GITHUB_STEP_SUMMARY
